name: Deploy Opus Atlas

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Generate Prisma Client
      run: npx prisma generate
      
    - name: Type check
      run: npx tsc --noEmit
      
    - name: Lint code
      run: npm run lint
      
    - name: Build application
      run: npm run build
      env:
        DATABASE_URL: "mongodb://build:build@localhost:27017/build"
        NEXTAUTH_SECRET: "build-secret-temp"
        NEXTAUTH_URL: "http://localhost:3000"
        SKIP_ENV_VALIDATION: "true"

  deploy-dev:
    needs: build-and-test
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to Development
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          cd /opt/opus-atlas/app-source/Classical-Music
          git checkout dev
          git pull origin dev
          docker-compose build --no-cache app-dev
          docker-compose up -d app-dev
          
    - name: Health check DEV
      run: |
        sleep 30
        curl -u "opusatlas:DevOpusAtlas2024!" -f https://dev.opusatlas.com.br/nginx-health || exit 1

  deploy-prod:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to Production
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          cd /opt/opus-atlas/app-source/Classical-Music
          git checkout main
          git pull origin main
          docker-compose build --no-cache app-prod
          docker-compose up -d app-prod
          
    - name: Health check PROD
      run: |
        sleep 60
        curl -f https://opusatlas.com.br/api/health || exit 1
        
    - name: Rollback on failure
      if: failure()
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          cd /opt/opus-atlas/app-source/Classical-Music
          git checkout HEAD~1
          docker-compose build --no-cache app-prod
          docker-compose up -d app-prod
